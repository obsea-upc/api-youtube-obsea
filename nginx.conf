# /etc/nginx/sites-available/yt-monitor
#
# Flask NUNCA se expone directo a internet. nginx termina TLS, limita
# conexiones y reenvía a gunicorn en localhost.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name tu-dominio.com;
    # Todo a HTTPS, sin excepciones
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tu-dominio.com;

    # Certificados de Let's Encrypt (certbot los genera y renueva gratis)
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # No reveles la versión de nginx
    server_tokens off;

    # Cuerpos grandes = posible DoS. Esta API solo recibe JSON pequeño.
    client_max_body_size 64k;

    # IMPORTANTE: no loguear el header Authorization.
    # El formato 'combined' por defecto NO lo incluye, así que estás bien,
    # pero si personalizas el log_format, nunca añadas $http_authorization.
    access_log /var/log/nginx/yt-monitor.access.log;
    error_log  /var/log/nginx/yt-monitor.error.log warn;

    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Cualquier otra ruta: 404 seco, sin pistas
    location / {
        return 404;
    }
}
